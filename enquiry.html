<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVINGCARE | Product Enquiry & Consultation</title>
<style>
    :root {
        --samsung-black: #000000;
        --samsung-gray-900: #1a1a1a;
        --samsung-gray-700: #444444;
        --samsung-gray-500: #888888;
        --samsung-gray-200: #e6e6e6;
        --samsung-gray-100: #f6f6f6;
        --samsung-white: #ffffff;
        --samsung-blue: #1428a0;
        --font-family: 'SamsungOne', 'Pretendard', '맑은 고딕', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
        font-family: var(--font-family);
        color: var(--samsung-black);
        background-color: var(--samsung-white);
        line-height: 1.5;
        word-break: keep-all;
        -webkit-font-smoothing: antialiased;
    }

    a { text-decoration: none; color: inherit; }

    /* Header Navigation */
    .header {
        border-bottom: 1px solid var(--samsung-gray-200);
        background: var(--samsung-white);
        position: sticky;
        top: 0;
        z-index: 100;
    }
    .header-inner {
        max-width: 1440px;
        margin: 0 auto;
        padding: 16px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 14px;
        font-weight: 700;
    }
    .nav-links { display: flex; gap: 30px; align-items: center; }
    .nav-links a { 
        text-decoration: none; 
        color: var(--samsung-gray-500); 
        font-size: 14px; 
        font-weight: 600; 
        transition: all 0.2s ease; 
        padding-bottom: 2px; 
    }
    .nav-links a:hover { color: var(--samsung-black); }
    .nav-links a.active { 
        color: var(--samsung-black); 
        font-size: 16px; 
        font-weight: 800; 
        border-bottom: 2.5px solid var(--samsung-black); 
    }
    .logo { font-size: 20px; letter-spacing: -1px; font-weight: 800; }

    /* Enquiry Container */
    .enquiry-container {
        max-width: 800px;
        margin: 60px auto 100px;
        padding: 0 40px;
    }
    .enquiry-header {
        text-align: center;
        margin-bottom: 48px;
    }
    .enquiry-header h1 {
        font-size: 36px;
        font-weight: 800;
        letter-spacing: -1px;
        margin-bottom: 12px;
    }
    .enquiry-header p {
        font-size: 16px;
        color: var(--samsung-gray-700);
    }

    .form-group {
        margin-bottom: 24px;
    }
    .form-label {
        display: block;
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--samsung-black);
    }
    .form-input, .form-select, .form-textarea {
        width: 100%;
        padding: 16px 20px;
        border: 1px solid var(--samsung-gray-200);
        border-radius: 12px;
        font-size: 15px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s;
        background: var(--samsung-white);
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
        border-color: var(--samsung-black);
    }
    .form-textarea {
        height: 150px;
        resize: vertical;
    }
    .btn-submit {
        width: 100%;
        padding: 18px;
        background: var(--samsung-black);
        color: var(--samsung-white);
        border: none;
        border-radius: 100px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 16px;
    }
    .btn-submit:hover {
        background: var(--samsung-gray-900);
    }

    /* Footer */
    .footer {
        background: var(--samsung-gray-100);
        padding: 60px 40px;
        font-size: 12px;
        color: var(--samsung-gray-500);
        border-top: 1px solid var(--samsung-gray-200);
    }
    .footer-inner { max-width: 1440px; margin: 0 auto; }
    .footer-links { display: flex; gap: 20px; margin-bottom: 20px; font-weight: 700; color: var(--samsung-black); }
</style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a href="home.html" class="logo">LIVINGCARE</a>
        <nav class="nav-links">
            <a href="home.html">HOME</a>
            <a href="lumos.html">LUMOS</a>
            <a href="opal.html">OPAL</a>
            <a href="onyx.html">ONYX</a>
            <a href="jewel.html">JEWEL</a>
            <a href="enquiry.html" class="active">ENQUIRY</a>
        </nav>
        <div style="display: flex; gap: 16px;">
        </div>
    </div>
</header>

<div class="breadcrumb" style="max-width: 800px; margin: 32px auto 0; padding: 0 40px; font-size: 13px; font-weight: 600; color: var(--samsung-gray-500);">
    <a href="home.html" style="color: var(--samsung-gray-700);">Home</a> &gt; <span class="breadcrumb-active" style="color: var(--samsung-black); font-weight: 800;">Enquiry</span>
</div>

<div class="enquiry-container" style="margin-top: 30px;">
    <div class="enquiry-header">
        <h1>제품 문의 및 상담 신청</h1>
        <p>리빙케어 정수기에 관한 문의사항을 남겨주시면 상담원이 신속하게 안내해 드립니다.</p>
    </div>

    <form onsubmit="alert('문의가 성공적으로 접수되었습니다. 담당자가 곧 연락드리겠습니다.'); return false;">
        <div class="form-group">
            <label class="form-label">관심 제품</label>
            <select class="form-select" required>
                <option value="LUMOS">LUMOS(UCHP-01)</option>
                <option value="OPAL">OPAL(CHP-102)</option>
                <option value="ONYX">ONYX(TCHP-01)</option>
                <option value="JEWEL">JEWEL(CHP-101)</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">성함</label>
            <input type="text" class="form-input" placeholder="홍길동" required>
        </div>

        <div class="form-group">
            <label class="form-label">연락처</label>
            <input type="tel" class="form-input" placeholder="010-1234-5678" required>
        </div>

        <div class="form-group">
            <label class="form-label">이메일</label>
            <input type="email" class="form-input" placeholder="example@livingcare.co.kr" required>
        </div>

        <div class="form-group">
            <label class="form-label">문의 내용</label>
            <textarea class="form-textarea" placeholder="설치 장소, 견적 문의, 이전 설치 등 상세 내용을 남겨주세요." required></textarea>
        </div>

        <button type="submit" class="btn-submit">상담 신청하기</button>
    </form>
</div>

<footer class="footer">
    <div class="footer-inner">
        <div class="footer-links">
            <a href="#">회사소개</a>
            <a href="#">이용약관</a>
            <a href="#"><strong>개인정보처리방침</strong></a>
            <a href="#">전자공고</a>
            <a href="#">고객센터</a>
        </div>
        <p>
            (주)리빙케어 | 대표자: 권택율 | 사업자등록번호: 514-81-66908<br>
            통신판매업신고번호: 제달성-0000호 | 주소: 대구광역시 달성군 유가읍 테크노남로3길 7
        </p>
    </div>
</footer>

</body>
</html>
